name: Tests

on:
  pull_request:
  push:
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "worker/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test worker/tests/*.test.js
